# open-slide-server: self-hosted open-slide (slides + Claude agent) for ONE person.
# Settings: .env (see .env.example). Data: ./data. Claude token: start page (stored in data/claude).
#
# Security model (details in README.md):
#   - Only the gateway is reachable (on ${BIND}:${PORT}, default 127.0.0.1). It does NO login: put your
#     own HTTPS + login in front, with /share/ left public (docs/ingress.md).
#   - The editor runs code from the repos you open (Vite config, decks, the agent's tools). It has NO
#     real Claude token (claude-proxy adds it) and no direct network: web access only through
#     egress-proxy (public addresses only; EDITOR_INTERNET=off disables it).
#   - Nothing gets the Docker socket. Nothing runs as root. Every container is read-only with no capabilities.
name: open-slide-server

x-hardened: &hardened
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app: &app
  <<: *hardened
  image: ${OPEN_SLIDE_REGISTRY:-ghcr.io/valentinherrmann}/open-slide-server-app:${OPEN_SLIDE_VERSION:-latest}

services:
  gateway:
    <<: *hardened
    build: { context: ., target: gateway }
    image: ${OPEN_SLIDE_REGISTRY:-ghcr.io/valentinherrmann}/open-slide-server-gateway:${OPEN_SLIDE_VERSION:-latest}
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    ports: ["${BIND:-127.0.0.1}:${PORT:-8080}:8080"]
    volumes:
      - ./data/public:/srv:ro
    tmpfs: [/tmp]
    networks: [edge, editor-link, internal]
    mem_limit: 128m
    pids_limit: 64

  editor:
    # open-slide dev server + the agent (Claude Code). Sees only the active project.
    <<: *app
    build: { context: ., target: app }
    restart: always # exits on project switch; the restart re-mounts ./data/active
    entrypoint: ["node", "/opt/open-slide/editor/run.mjs"]
    environment:
      HOME: /home/node
      EDITOR_BASE: /editor/
      PUBLIC_URL: ${PUBLIC_URL}
      # Claude: placeholder token. In the editor, api.anthropic.com IS claude-proxy (network alias,
      # trusted via its CA certificate), which swaps in the real token.
      CLAUDE_CODE_OAUTH_TOKEN: replaced-by-claude-proxy
      NODE_EXTRA_CA_CERTS: /claude-ca/claude-ca.crt
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      # Internet only through egress-proxy (EDITOR_INTERNET in .env); never to private addresses.
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: api.anthropic.com,claude-proxy,localhost,127.0.0.1
      no_proxy: api.anthropic.com,claude-proxy,localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"
      NODE_NO_WARNINGS: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ./data/active:/workspace
      - ./data/home:/home/node
      - ./data/control:/control:ro
      - ./data/claude-ca:/claude-ca:ro
    tmpfs: ["/tmp:uid=1000,exec"]
    networks: [sandbox]
    mem_limit: 1g
    pids_limit: 256

  egress-proxy:
    # The editor's only way to the internet: web ports to public addresses only (no host, no LAN).
    # EDITOR_INTERNET=off in .env refuses everything.
    <<: *hardened
    image: ${OPEN_SLIDE_REGISTRY:-ghcr.io/valentinherrmann}/open-slide-server-gateway:${OPEN_SLIDE_VERSION:-latest}
    depends_on: [gateway] # same image, built there
    entrypoint: ["/bin/sh", "/etc/open-slide/egress/entrypoint.sh"]
    environment:
      EDITOR_INTERNET: ${EDITOR_INTERNET:-on}
    tmpfs: [/tmp]
    networks: [sandbox, editor-egress]
    mem_limit: 96m
    pids_limit: 64

  editor-relay:
    # The gateway reaches the editor only through this relay, so gateway and editor share no
    # network: code in the editor can't reach the gateway (which does no login). The relay
    # only ever forwards to the editor itself.
    <<: *hardened
    image: alpine/socat@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
    user: "65534:65534"
    # One process per connection: max-children makes socat wait at the limit instead of failing
    # (a failed fork kills it, and every restart cut the editor off with 502s and reload loops).
    command: ["TCP-LISTEN:8080,fork,reuseaddr,max-children=200", "TCP:editor:8080"]
    networks: [sandbox, editor-link]
    mem_limit: 128m
    pids_limit: 256

  claude-proxy:
    # Holds the Claude token. Forwards only Claude API calls, only to api.anthropic.com.
    <<: *hardened
    image: ${OPEN_SLIDE_REGISTRY:-ghcr.io/valentinherrmann}/open-slide-server-gateway:${OPEN_SLIDE_VERSION:-latest}
    depends_on: [gateway] # same image, built there
    entrypoint: ["/bin/sh", "/etc/open-slide/proxy/entrypoint.sh"]
    environment:
      XDG_DATA_HOME: /pki
    volumes:
      - ./data/claude:/secrets:ro # the Claude token (start page -> worker); nobody else mounts it
      - ./data/claude-pki:/pki # the proxy's CA incl. key; nobody else mounts it
      - ./data/claude-ca:/ca-out # only the CA certificate, read by the editor
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "443" # listen on 443 without root or capabilities
    tmpfs: [/tmp]
    networks:
      sandbox:
        aliases: [api.anthropic.com] # what the editor reaches for Anthropic
      proxy-egress: {}
    mem_limit: 64m
    pids_limit: 64

  admin:
    # Web UI backend. Powerless: reads state/view, drops request files for the worker.
    <<: *app
    entrypoint: ["node", "/opt/open-slide/admin/server.mjs"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./data/state/view:/state/view:ro
      - ./data/state/requests:/state/requests
    networks: [internal]
    mem_limit: 96m
    pids_limit: 32

  worker:
    # Projects, git sync (GitHub token / deploy keys), builds, share links. Runs no project code.
    <<: *app
    entrypoint: ["python3", "-u", "/opt/open-slide/worker/worker.py"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      CYCLE_SECONDS: ${CYCLE_SECONDS:-120}
      HOME: /tmp
    volumes:
      - ./data:/data
    tmpfs: ["/tmp:uid=1000"]
    networks: [egress]
    mem_limit: 256m
    pids_limit: 128

  builder:
    # Static builds of decks. Runs project code, so: no network, project read-only,
    # one project per container lifetime (the mount follows ./data/build-src).
    <<: *app
    restart: always
    entrypoint: ["node", "/opt/open-slide/runner/runner.mjs", "build"]
    volumes:
      - ./data/build-src:/src:ro
      - ./data/jobs/build:/jobs
    tmpfs: ["/tmp:uid=1000,exec"]
    network_mode: none
    mem_limit: 1g
    pids_limit: 256

  deps:
    # npm ci --ignore-scripts (no install scripts run) for one project at a time.
    <<: *app
    restart: always
    entrypoint: ["node", "/opt/open-slide/runner/runner.mjs", "deps"]
    volumes:
      - ./data/deps-src:/src
      - ./data/jobs/deps:/jobs
    tmpfs: ["/tmp:uid=1000,exec"]
    networks: [egress]
    mem_limit: 1g
    pids_limit: 256

networks:
  edge: {} # gateway: the published port
  egress: {} # worker (GitHub), deps (npm registry)
  proxy-egress: {} # claude-proxy -> api.anthropic.com
  editor-egress: {} # egress-proxy -> internet (only what EDITOR_INTERNET allows)
  sandbox:
    # editor <-> claude-proxy / egress-proxy / editor-relay. No direct internet (internal) and no IP for the host
    # on this bridge (inhibit_ipv4), so the editor can't reach host services either.
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  editor-link:
    # gateway <-> editor-relay
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  internal:
    # gateway <-> admin
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
