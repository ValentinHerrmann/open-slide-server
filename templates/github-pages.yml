# OPTIONAL: publish an open-slide repo on GitHub Pages (PUBLIC website).
# Copy to .github/workflows/pages.yml in the repo, then: Settings -> Pages -> Source: GitHub Actions.
# - Pages sites are public (private repos need a paid plan, and the site is still public).
#   For private sharing use the share links in the admin UI instead.
# - The site lives at https://<owner>.github.io/<repo>/, so the build gets base /<repo>/ without
#   touching open-slide.config.ts (same wrapper as /root/open-slide/publish/build-one.sh).
name: Publish slides to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with base /<repo>/
        run: |
          mv open-slide.config.ts open-slide.user.config.ts 2>/dev/null || echo 'export default {};' > open-slide.user.config.ts
          cat > open-slide.config.ts <<EOF
          import user from './open-slide.user.config';
          const u: any = user ?? {};
          export default { ...u, base: '/${{ github.event.repository.name }}/', agent: { enabled: false } };
          EOF
          npx open-slide build --out-dir dist
          cp dist/index.html dist/404.html   # SPA fallback for deep links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
